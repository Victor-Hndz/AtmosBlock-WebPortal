# FAST-IBAN: parámetros del detector (ALG-305, L4). Se vuelcan completos en la cabecera de cada CSV de salida.
# Formato: YAML plano, una clave por línea ("clave: valor"); "#" empieza un comentario.
# Otra ruta: variable de entorno FAST_IBAN_PARAMS.

# Espaciado entre puntos candidatos, en grados. Debe ser múltiplo entero de la resolución del fichero.
# 1° (ALG-359): múltiplo de 0,25°, 0,5° y 1°, así que los candidatos caen en las mismas coordenadas a cualquiera de esas
# resoluciones (necesario para ALG-308); y ≤ ray_distance_km/4 ≈ 125 km. Antes, 1,25° (5 celdas a 0,25°).
candidate_spacing_deg: 1.0

# Rayos de círculo máximo por punto (múltiplo de 8) y su longitud, en km.
n_rays: 64
ray_distance_km: 500

# Fracción de rayos que deben quedar por debajo (máximo) o por encima (mínimo) del punto.
pass_fraction: 0.9

# Separación entre contornos, en metros de altura geopotencial.
contour_step_m: 20

# Radio máximo de búsqueda de contornos y de emparejamiento máximo-mínimos, en km.
search_radius_km: 3000

# Paso, en km, con el que se muestrea cada rayo geodésico al buscar contornos (ALG-360). No supera el de la rejilla más
# fina admitida (0,25° ≈ 27,8 km) ni la malla nativa de ERA5 (≈ 31 km), así que no depende de la resolución del fichero.
contour_ray_step_km: 25

# Se descartan los clusters cuyo punto más al norte no queda estrictamente entre estas latitudes, en grados.
cluster_lat_min_deg: 30
cluster_lat_max_deg: 85

# Número mínimo de puntos de un cluster. Depende de la rejilla: pasará a área mínima en km² (ALG-306).
min_cluster_points: 2

# Distancia máxima, en km, del mínimo de un Rex al meridiano del máximo: R·asin(cos φ_min·|sin Δλ|), con cos Δλ > 0
# (ALG-364). Son los 10° de la regla anterior evaluados en la latitud típica de la baja, φ_min = 50°N (712,6 km,
# redondeado): la baja de un Rex del HN queda 15-20° al sur de una alta a 60-65°N (Sousa et al. 2021; Hirt et al. 2018;
# Barriopedro et al. 2006), y la mediana de φ_min de nuestros Rex es 52°N. La alternativa de 60°N (550 km) es la
# latitud de la alta, no la de la baja. Detalle y prueba empírica en docs/delta_correcciones.md.
rex_max_offset_km: 700
