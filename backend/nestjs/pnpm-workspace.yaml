# Proyecto pnpm independiente (sin monorepo): el contexto de build del Dockerfile no cambia.
# Defensas de cadena de suministro escritas explícitamente aunque coincidan con los valores por
# defecto, para que ninguna configuración global las desactive (WEB-300).
minimumReleaseAge: 1440
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
# Un paquete por línea con script de instalación; true solo si sin él se rompe build, tests o runtime.
allowBuilds:
  # De Jest 30 (jest-haste-map): el script solo compila desde fuente con build_from_source=true;
  # el binario precompilado llega como dependencia opcional por plataforma.
  '@parcel/watcher': false
  # Telemetría de instalación que trae swagger-ui-dist: no aporta nada al proyecto.
  '@scarf/scarf': false
  # Trae binarios precompilados (linux-x64 glibc y musl, win32-x64, arm64): el script (node-gyp-build)
  # solo compila desde fuente si falta el de la plataforma. Cambiar a true en plataformas sin precompilado (p. ej. macOS Intel).
  argon2: false
  # De Jest 30 (jest-resolve): el postinstall (napi-postinstall) comprueba el binario nativo, que llega
  # como dependencia opcional por plataforma, y solo si falta lo descarga del registro.
  unrs-resolver: false
