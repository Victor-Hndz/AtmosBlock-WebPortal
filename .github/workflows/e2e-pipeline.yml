name: E2E pipeline

# WEB-217: una petición real de principio a fin (configurador → núcleo en C → mapas → resultados) sin el CDS:
# el caso de ejemplo se copia al volumen del configurador, que no descarga si el fichero ya existe.
# Construye todas las imágenes (varios minutos): no es un check obligatorio.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - "backend/FAST-IBAN_Project/**"
      - "docker-compose.yml"
      - "e2e/**"
      - ".github/workflows/e2e-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: e2e-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Entorno de pruebas (secretos aleatorios, sin clave del CDS)
        run: |
          SECRETO=$(openssl rand -hex 24)
          sed "s/change-me-min-8-chars/$SECRETO/; s/change-me/$SECRETO/g" .env.example > .env
          cp frontend/.env.example frontend/.env
      - name: Pila completa
        run: |
          docker compose up -d --build
          timeout 300 sh -c 'until curl -fs http://localhost:3000/api/health; do sleep 5; done'
      - name: Caso de ejemplo en el volumen del configurador
        # WEB-359: la carpeta la decide el configurador (ALG-369: el área descargada va en la ruta), así que se le
        # pregunta en vez de repetir aquí la fórmula del margen. Si el fichero no queda donde lo busca, intenta
        # descargar del CDS —sin clave en el CI— y la prueba se cuelga hasta el tiempo límite.
        run: |
          RUTA=$(docker compose exec -T configurator_module python -c "
          import sys
          sys.path[:0] = ['/app', '/app/configurator']
          from rutas import area_de_descarga, mount_file_name
          peticion = {'variableName': 'geopotential', 'pressureLevels': ['500'], 'years': ['2022'],
                      'months': ['03'], 'days': ['14'], 'hours': ['0', '6', '12', '18']}
          print(mount_file_name(peticion, area_de_descarga(['90', '-180', '0', '180'], 'geopotential')))" | tail -1)
          echo "El configurador espera el fichero en $RUTA"
          docker compose exec -T configurator_module mkdir -p "$(dirname "$RUTA")"
          CASO=backend/FAST-IBAN_Project/execution/code/tests/fixtures/geopot_500hPa_2022-03-14_00-06-12-18UTC.nc
          docker compose cp "$CASO" "configurator_module:$RUTA"
          docker compose exec -T configurator_module test -s "$RUTA"
      - name: Dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Playwright y Chromium
        working-directory: e2e
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Pipeline completo
        working-directory: e2e
        run: pnpm run test:pipeline
      - name: Logs de la pila
        if: failure()
        run: docker compose logs --no-color nest_api configurator_module handler_module execution_module visualization_module
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-pipeline
          path: e2e/playwright-report
          retention-days: 7
