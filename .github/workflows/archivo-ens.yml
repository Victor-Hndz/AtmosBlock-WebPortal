name: Archivo ENS

# PRD-101: guarda cada día el Z500 de las previsiones por conjuntos abiertas de ECMWF (IFS y AIFS) en un release
# mensual; PRD-303: genera con él el producto de bloqueo en otro release mensual; PRD-401: publica sus JSON en GitHub
# Pages (rama gh-pages) para el portal. Dos ejecuciones al día: la segunda recoge lo que la primera no encontró.
on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fechas AAAAMMDD separadas por espacios (vacío = hoy y ayer)"
        required: false
      regenerar:
        description: "Rehacer y sustituir el producto de esas fechas aunque ya esté subido"
        type: boolean
        default: false

permissions:
  contents: write # crear el release del mes y subir los ficheros

concurrency:
  group: archivo-ens
  cancel-in-progress: false

jobs:
  archivar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Entorno
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r prediccion/archivo/requirements.txt
      - name: Tests
        run: |
          .venv/bin/python prediccion/archivo/test_archivar.py
          bash prediccion/archivo/test_subir.sh
          .venv/bin/python prediccion/producto/test_producto.py
          bash prediccion/producto/test_generar.sh
          bash prediccion/producto/test_publicar.sh
          node --test prediccion/pages/test_logica.mjs
      - name: Archivar y subir
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ inputs.fecha }} # por entorno, nunca interpolado en el script; subir.sh valida el formato
        run: bash prediccion/archivo/subir.sh
      - name: Producto de bloqueo (PRD-303)
        if: ${{ !cancelled() }} # aunque falle un día anterior del archivo, se genera lo que se pueda
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ inputs.fecha }}
          REGENERAR: ${{ inputs.regenerar && '1' || '' }}
          ARCHIVO: salida # reutiliza lo recién archivado; generar.sh baja del release lo que falte
        run: bash prediccion/producto/generar.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          ref: gh-pages
          path: paginas
      - name: Publicar los JSON en GitHub Pages (PRD-401)
        if: ${{ !cancelled() }}
        run: |
          git -C paginas config user.name "github-actions[bot]"
          git -C paginas config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash prediccion/producto/publicar.sh
