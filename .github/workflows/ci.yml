name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Obligatorios en la protección de main ---------------------------------

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  c-core:
    runs-on: ubuntu-latest
    container:
      image: victorhndz/netcdf-base@sha256:6f448a9eda3a12073be2c427d524d984387a85fc408a2f5755b648f59361a429 # latest a 2025-02-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar
        working-directory: backend/FAST-IBAN_Project/execution/code
        run: |
          cmake -S . -B build
          cmake --build build --parallel
      - name: CTest
        run: ctest --test-dir backend/FAST-IBAN_Project/execution/code/build --output-on-failure
      - name: Avisos -Wall -Wextra frente a la línea base
        run: sh backend/FAST-IBAN_Project/execution/code/tests/check_warnings.sh

  # --- Aún no obligatorios: hoy fallan con el código existente ----------------
  # Pasan a obligatorios en cuanto se arreglen (lint de ambos paquetes y @types/jest).

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - run: npm ci
      - name: Lint (sin --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Tests
        if: ${{ !cancelled() }}
        run: npx jest --ci

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
