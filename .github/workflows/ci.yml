name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Obligatorios en la protección de main ---------------------------------

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  c-core:
    runs-on: ubuntu-latest
    container:
      image: victorhndz/netcdf-base@sha256:6f448a9eda3a12073be2c427d524d984387a85fc408a2f5755b648f59361a429 # latest a 2025-02-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar con -Wall -Wextra -Werror
        working-directory: backend/FAST-IBAN_Project/execution/code
        run: |
          cmake -S . -B build -DFAST_IBAN_WERROR=ON
          cmake --build build --parallel
      - name: CTest
        run: ctest --test-dir backend/FAST-IBAN_Project/execution/code/build --output-on-failure
      - name: valgrind sin fugas en serie y OpenMP (ALG-203)
        run: |
          apt-get update -qq && apt-get install -y -qq valgrind > /dev/null
          CODE=$GITHUB_WORKSPACE/backend/FAST-IBAN_Project/execution/code
          CASO=$CODE/tests/fixtures/geopot_500hPa_2022-03-14_00-06-12-18UTC.nc
          for ejecucion in "FAST-IBAN 1" "FAST-IBAN_omp 4"; do
            set -- $ejecucion
            cd "$(mktemp -d)"
            valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=3 \
              "$CODE/build/$1" "$CASO" 25 85 -180 180 out/ "$2" > /dev/null
          done
      - name: Compilar la variante de temperatura (code_t) con -Wall -Wextra -Werror
        working-directory: backend/FAST-IBAN_Project/execution/code_t
        run: |
          cmake -S . -B build -DFAST_IBAN_WERROR=ON
          cmake --build build --parallel

  imagenes-sin-secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ningún secreto horneado en las imágenes Docker (WEB-104)
        env:
          PORT: "3000"
          RABBITMQ_PORT: "5672"
          RABBITMQ_MANAGEMENT_PORT: "15672"
          DB_PORT: "5432"
        run: |
          touch .env
          docker compose config --format json | python3 .github/scripts/check_imagen_sin_secretos.py .

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - run: npm ci
      - name: Lint (sin --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Tests
        if: ${{ !cancelled() }}
        run: npx jest --ci

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  compose-seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Servicios internos sin puertos publicados (WEB-105)
        env:
          PORT: "3000"
          RABBITMQ_PORT: "5672"
          RABBITMQ_MANAGEMENT_PORT: "15672"
          DB_PORT: "5432"
        run: |
          touch .env
          docker compose config --format json | python3 .github/scripts/check_compose_puertos.py
      - name: Variables de entorno documentadas en .env.example (WEB-208)
        run: python3 .github/scripts/check_env_example.py

  python-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests de los handlers de Python (sin dependencias externas)
        run: |
          for t in $(git ls-files 'backend/FAST-IBAN_Project/*test_*.py'); do
            echo "== $t"
            python3 "$t" || exit 1
          done

  e2e:
    # WEB-217: navegador y API contra la pila real (sin el pipeline de cálculo ni el CDS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Entorno de pruebas (secretos aleatorios, sin clave del CDS)
        run: |
          SECRETO=$(openssl rand -hex 24)
          sed "s/change-me-min-8-chars/$SECRETO/; s/change-me/$SECRETO/g" .env.example > .env
          cp frontend/.env.example frontend/.env
      - name: API y los servicios de los que depende
        run: docker compose up -d --build --wait nest_api
      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Playwright y Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas del portal
        working-directory: e2e
        run: npm test
      - name: Logs de la API
        if: failure()
        run: docker compose logs --no-color nest_api
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
