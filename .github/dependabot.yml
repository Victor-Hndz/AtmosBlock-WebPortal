version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /backend/nestjs
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    # Las versiones mayores se migran a mano, con PR propia; las alertas de seguridad siguen llegando
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directories:
      - /backend/FAST-IBAN_Project/configurator
      - /backend/FAST-IBAN_Project/handler
      - /backend/FAST-IBAN_Project/utils
      - /backend/FAST-IBAN_Project/visualization
      - /cron_cleanup
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]
    # El CI no instala estos requirements: las mayores (numpy, pandas...) se prueban a mano
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /backend/nestjs
      - /backend/FAST-IBAN_Project/configurator
      - /backend/FAST-IBAN_Project/handler
      - /backend/FAST-IBAN_Project/execution
      - /backend/FAST-IBAN_Project/visualization
      - /cron_cleanup
      - /custom_images/netcdf-base
    schedule:
      interval: monthly
    # El CI no construye las imágenes: cambiar de Python, Node o Ubuntu es una migración manual
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
